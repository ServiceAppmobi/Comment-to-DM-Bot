name: CI — Testy Bota

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Uruchom testy jednostkowe (zero zależności)
        run: npm test
