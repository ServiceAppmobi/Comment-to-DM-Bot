name: Deploy na GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Przygotuj artefakt statyczny
        run: |
          mkdir -p _site
          cp index.html whatsapp.html styles.css _site/
          cp -r src data _site/

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Wyślij artefakt GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
