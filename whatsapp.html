<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServiceApp — Download App &amp; WhatsApp</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #161f33;
      --input: #0d1526;
      --border: #24304a;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #25d366;
      --accent-hover: #1ebe5b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #132a24 0%, var(--bg) 52%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 470px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px 22px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .lang-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 18px;
    }
    .lang-btn {
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .lang-btn:hover { color: var(--text); border-color: var(--accent); }
    .lang-btn.active {
      background: rgba(37, 211, 102, 0.16);
      border-color: var(--accent);
      color: #4ade80;
    }
    .avatar {
      width: 68px;
      height: 68px;
      margin: 0 auto 12px;
      border-radius: 20px;
      background: linear-gradient(135deg, #25d366, #0ea5e9);
      color: #052e16;
      font-weight: 800;
      font-size: 24px;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 24px rgba(37, 211, 102, 0.3);
    }
    h1 { margin: 0; font-size: 23px; }
    .tagline { margin: 8px 0 14px; font-size: 13.5px; color: var(--muted); }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(37, 211, 102, 0.14);
      color: #4ade80;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #25d366; }
    .section-label {
      text-align: left;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 14px 0 8px;
    }
    .store-grid { display: grid; gap: 10px; margin-bottom: 16px; }
    .store-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14.5px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      transition: all 0.15s ease;
    }
    .store-btn.recommended {
      background: linear-gradient(135deg, #25d366, #10b981);
      border-color: #25d366;
      color: #052e16;
      box-shadow: 0 10px 24px rgba(37, 211, 102, 0.25);
    }
    .store-btn:hover { transform: translateY(-1px); border-color: var(--accent); }
    .store-btn small { font-size: 11.5px; opacity: 0.85; display: block; font-weight: 500; }
    .custom-box {
      text-align: left;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      margin-top: 8px;
    }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    input, textarea {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13.5px;
      font-family: inherit;
      margin-bottom: 10px;
    }
    textarea { min-height: 66px; resize: vertical; }
    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      background: var(--accent);
      color: #052e16;
      font-weight: 800;
      font-size: 14.5px;
      cursor: pointer;
    }
    .submit-btn:hover { background: var(--accent-hover); }
    .qr-wrap {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .qr-inner { background: #fff; padding: 10px; border-radius: 12px; display: inline-block; }
    .footer-link {
      display: inline-block;
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
    }
    .footer-link:hover { color: var(--text); }
  </style>
</head>
<body>
  <main class="card">
    <div class="lang-bar" id="lang-bar"></div>
    <div class="avatar" id="brand-avatar">SA</div>
    <h1 id="brand-name">ServiceApp</h1>
    <p class="tagline" id="brand-tagline"></p>
    <div class="status-pill" id="source-pill"></div>

    <div class="section-label" id="lbl-step1"></div>
    <div class="store-grid" id="store-buttons"></div>

    <div class="section-label" id="lbl-step2"></div>
    <form class="custom-box" id="custom-wa-form" style="border-top:none;padding-top:0;margin-top:0;">
      <label for="visitor-name" id="lbl-name"></label>
      <input type="text" id="visitor-name" />
      <label for="visitor-msg" id="lbl-msg"></label>
      <textarea id="visitor-msg"></textarea>
      <button type="submit" class="submit-btn" id="btn-wa-submit"></button>
    </form>

    <div class="qr-wrap">
      <div class="qr-inner" id="landing-qr"></div>
      <span id="lbl-qr-hint" style="font-size:11.5px;color:var(--muted);"></span>
    </div>

    <a class="footer-link" href="./index.html" id="lbl-studio">← ServiceApp Social Bot Studio</a>
  </main>

      },
      gn: {

        tagline: 'Emboguejy ServiceApp reiete Android térã iPhone-pe ha eñemboheraguapy 1 aravo’ípe!',

        androidTitle: '🤖 Emboguejy Android-pe',
        androidSub: 'Google Play-pe',
        iosTitle: '🍎 Emboguejy iPhone-pe',
        iosSub: 'App Store-pe',
        webTitle: '🌐 ServiceApp Web',
        cta: 'Mboguejy →',
        nameLabel: 'Nde réra',
        namePh: 'techapyrã: Mateo',
        msgLabel: 'Ne marandu ServiceApp rehegua',
        msgPh: "Mba'éichapa! Aipota amboguejy ServiceApp...",
        waBtn: '📲 Ehai WhatsApp-pe',
        waDefault: "Mba'éichapa! ({{source}}). Aipota amboguejy ServiceApp!",
        waGreet: "Mba'éichapa! Che ha'e",
        qrHint: 'Eskanea ne celular-pe eike hag̃ua WhatsApp-pe.',
      },
    };

    const params = new URLSearchParams(window.location.search);
    let config = {
      brand: { name: 'ServiceApp', avatarText: 'SA' },
      appLinks: {
        web: 'https://serviceapp.mobi',
        android: 'https://play.google.com/store/apps/details?id=com.serviceapp.mobile',
        ios: 'https://apps.apple.com/ie/app/pl-serviceapp/id1253478797',
      },
      whatsapp: { phone: '34627193784', defaultCampaign: 'serviceapp-download' },
    };

    try {
      const res = await fetch('./data/rules.json', { cache: 'no-store' });
      if (res.ok) config = await res.json();
    } catch {
      // fallback
    }

    const source = (params.get('src') || params.get('source') || 'social-bio').toLowerCase();
    const phone = params.get('phone') || config.whatsapp?.phone || '34627193784';
    const brandName = params.get('brand') || config.brand?.name || 'ServiceApp';
    const campaign = params.get('campaign') || config.whatsapp?.defaultCampaign || 'serviceapp-download';

    function detectInitialLang() {
      const q = (params.get('lang') || '').toLowerCase().slice(0, 2);
      if (I18N[q]) return q;
      const browserLang = (navigator.language || 'pl').toLowerCase().slice(0, 2);
      return I18N[browserLang] ? browserLang : 'en';
    }

    let currentLang = detectInitialLang();
    const ua = navigator.userAgent || '';
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);

    function render() {
      const t = I18N[currentLang] || I18N.en;
      document.documentElement.lang = currentLang;
      document.title = `${brandName} — ${t.step1}`;
      document.getElementById('brand-avatar').textContent = config.brand?.avatarText || 'SA';
      document.getElementById('brand-name').textContent = brandName;
      document.getElementById('brand-tagline').textContent = t.tagline;
      document.getElementById('source-pill').innerHTML = `<span class="status-dot"></span>${t.pill}`;
      document.getElementById('lbl-step1').textContent = t.step1;
      document.getElementById('lbl-step2').textContent = t.step2;
      document.getElementById('lbl-name').textContent = t.nameLabel;
      document.getElementById('visitor-name').placeholder = t.namePh;
      document.getElementById('lbl-msg').textContent = t.msgLabel;
      document.getElementById('visitor-msg').placeholder = t.msgPh;
      document.getElementById('btn-wa-submit').textContent = t.waBtn;
      document.getElementById('lbl-qr-hint').textContent = t.qrHint;

      // Render language bar
      const langBar = document.getElementById('lang-bar');
      langBar.innerHTML = '';
      for (const [code, entry] of Object.entries(I18N)) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = `lang-btn${code === currentLang ? ' active' : ''}`;
        b.textContent = entry.label;
        b.addEventListener('click', () => {
          currentLang = code;
          render();
        });
        langBar.appendChild(b);
      }

      // Render store links
      const storeLinks = [
        {
          title: t.androidTitle,
          subtitle: t.androidSub,
          url: buildTrackedStoreUrl(params.get('android') || config.appLinks?.android || '', {
            source,
            campaign: `${campaign}-${currentLang}`,
            ref: 'landing',
          }),
          recommended: isAndroid || !isIOS,
        },
        {
          title: t.iosTitle,
          subtitle: t.iosSub,
          url: buildTrackedStoreUrl(params.get('ios') || config.appLinks?.ios || '', {
            source,
            campaign: `${campaign}-${currentLang}`,
            ref: 'landing',
          }),
          recommended: isIOS,
        },
        {
          title: t.webTitle,
          subtitle: config.appLinks?.web || 'https://serviceapp.mobi',
          url: buildTrackedStoreUrl(params.get('web') || config.appLinks?.web || 'https://serviceapp.mobi', {
            source,
            campaign: `${campaign}-${currentLang}`,
            ref: 'landing',
          }),
          recommended: false,
        },
      ];

      const storeContainer = document.getElementById('store-buttons');
      storeContainer.innerHTML = '';
      for (const item of storeLinks) {
        if (!item.url) continue;
        const a = document.createElement('a');
        a.className = `store-btn${item.recommended ? ' recommended' : ''}`;
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        const left = document.createElement('div');
        left.style.textAlign = 'left';
        const titleDiv = document.createElement('div');
        titleDiv.textContent = item.title;
        const sub = document.createElement('small');
        sub.textContent = item.subtitle;
        left.appendChild(titleDiv);
        left.appendChild(sub);

        const arrow = document.createElement('span');
        arrow.textContent = t.cta;

        a.appendChild(left);
        a.appendChild(arrow);
        storeContainer.appendChild(a);
      }

      const defaultWaUrl = buildWhatsAppUrl({
        phone,
        text: t.waDefault,
        campaign: `${campaign}-${currentLang}`,
        source,
        brand: brandName,
        appName: brandName,
      });

      if (defaultWaUrl) {
        document.getElementById('landing-qr').innerHTML = generateQrSvg(defaultWaUrl, { pixelSize: 150, margin: 2 });
      }
    }

    document.getElementById('custom-wa-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const t = I18N[currentLang] || I18N.en;
      const name = document.getElementById('visitor-name').value.trim();
      const msg = document.getElementById('visitor-msg').value.trim();
      const finalMsg = [
        name ? `${t.waGreet} ${name}!` : '',
        msg || t.waDefault.replace('{{source}}', source),
        `(${source} / ${currentLang.toUpperCase()})`,
      ]
        .filter(Boolean)
        .join(' ');

      const url = buildWhatsAppUrl({ phone, text: finalMsg, campaign, source, brand: brandName, appName: brandName });
      if (url) window.open(url, '_blank', 'noopener,noreferrer');
    });

    render();
  </script>
</body>
</html>
