<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServiceApp — Pobierz aplikację i napisz na WhatsApp</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #161f33;
      --input: #0d1526;
      --border: #24304a;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #25d366;
      --accent-hover: #1ebe5b;
      --blue: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #132a24 0%, var(--bg) 52%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .avatar {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      border-radius: 20px;
      background: linear-gradient(135deg, #25d366, #0ea5e9);
      color: #052e16;
      font-weight: 800;
      font-size: 24px;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 24px rgba(37, 211, 102, 0.3);
    }
    h1 { margin: 0; font-size: 23px; }
    .tagline { margin: 8px 0 16px; font-size: 13.5px; color: var(--muted); }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(37, 211, 102, 0.14);
      color: #4ade80;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 18px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #25d366; }
    .section-label {
      text-align: left;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 14px 0 8px;
    }
    .store-grid {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }
    .store-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14.5px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      transition: all 0.15s ease;
    }
    .store-btn.recommended {
      background: linear-gradient(135deg, #25d366, #10b981);
      border-color: #25d366;
      color: #052e16;
      box-shadow: 0 10px 24px rgba(37, 211, 102, 0.25);
    }
    .store-btn:hover { transform: translateY(-1px); border-color: var(--accent); }
    .store-btn small { font-size: 11.5px; opacity: 0.85; display: block; font-weight: 500; }
    .actions { display: grid; gap: 9px; margin-bottom: 18px; text-align: left; }
    .action-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 15px;
      border-radius: 12px;
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 13.5px;
      transition: all 0.15s ease;
    }
    .action-btn:hover {
      border-color: var(--accent);
      background: rgba(37, 211, 102, 0.1);
    }
    .action-btn span.arrow { color: var(--accent); font-weight: 700; white-space: nowrap; }
    .custom-box {
      text-align: left;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      margin-top: 8px;
    }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    input, textarea {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13.5px;
      font-family: inherit;
      margin-bottom: 10px;
    }
    textarea { min-height: 68px; resize: vertical; }
    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      background: var(--accent);
      color: #052e16;
      font-weight: 800;
      font-size: 14.5px;
      cursor: pointer;
    }
    .submit-btn:hover { background: var(--accent-hover); }
    .qr-wrap {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .qr-inner {
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
    }
    .footer-link {
      display: inline-block;
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
    }
    .footer-link:hover { color: var(--text); }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" id="brand-avatar">SA</div>
    <h1 id="brand-name">ServiceApp</h1>
    <p class="tagline" id="brand-tagline">Pobierz darmową aplikację ServiceApp na Androida lub iPhone'a!</p>
    <div class="status-pill" id="source-pill"><span class="status-dot"></span>Darmowa aplikacja · Rejestracja w 1 minutę</div>

    <div class="section-label">1. Pobierz aplikację ServiceApp</div>
    <div class="store-grid" id="store-buttons"></div>

    <div class="section-label">2. Lub napisz od razu na WhatsApp</div>
    <div class="actions" id="quick-actions"></div>

    <form class="custom-box" id="custom-wa-form">
      <label for="visitor-name">Twoje imię (opcjonalnie)</label>
      <input type="text" id="visitor-name" placeholder="np. Anna" />
      <label for="visitor-msg">Pytanie o ServiceApp / rejestrację</label>
      <textarea id="visitor-msg" placeholder="Cześć! Chcę pobrać ServiceApp i mam pytanie..."></textarea>
      <button type="submit" class="submit-btn">📲 Otwórz czat WhatsApp</button>
    </form>

    <div class="qr-wrap">
      <div class="qr-inner" id="landing-qr"></div>
      <span style="font-size:11.5px;color:var(--muted);">Na komputerze? Zeskanuj telefonem, aby przejść na WhatsApp.</span>
    </div>

    <a class="footer-link" href="./index.html">← Panel Social Bot Studio</a>
  </main>

  <script type="module">
    import { buildTrackedStoreUrl, buildWhatsAppUrl } from './src/engine.js';
    import { generateQrSvg } from './src/qr.js';

    const params = new URLSearchParams(window.location.search);
    let config = {
      brand: {
        name: 'ServiceApp',
        tagline: "Pobierz darmową aplikację ServiceApp na Androida lub iPhone'a!",
        avatarText: 'SA',
      },
      appLinks: {
        web: 'https://serviceapp.mobi',
        android: 'https://play.google.com/store/apps/details?id=com.serviceapp.mobile',
        ios: 'https://apps.apple.com/ie/app/pl-serviceapp/id1253478797',
      },
      whatsapp: {
        phone: '34627193784',
        defaultCampaign: 'serviceapp-download',
        defaultMessage: 'Cześć! Piszę z {{source}}. Chcę pobrać aplikację ServiceApp!',
      },
      rules: [],
    };

    try {
      const res = await fetch('./data/rules.json', { cache: 'no-store' });
      if (res.ok) config = await res.json();
    } catch {
      // use fallback config
    }

    const source = (params.get('src') || params.get('source') || 'social-bio').toLowerCase();
    const phone = params.get('phone') || config.whatsapp?.phone || '34627193784';
    const brandName = params.get('brand') || config.brand?.name || 'ServiceApp';
    const campaign = params.get('campaign') || config.whatsapp?.defaultCampaign || 'serviceapp-download';
    const tagline = config.brand?.tagline || "Pobierz darmową aplikację ServiceApp na Androida lub iPhone'a!";
    const avatarText = config.brand?.avatarText || 'SA';

    document.title = `${brandName} — Pobierz aplikację`;
    document.getElementById('brand-avatar').textContent = avatarText;
    document.getElementById('brand-name').textContent = brandName;
    document.getElementById('brand-tagline').textContent = tagline;

    const sourceLabels = {
      instagram: 'Instagram → ServiceApp',
      facebook: 'Facebook → ServiceApp',
      whatsapp: 'WhatsApp → ServiceApp',
      github: 'GitHub → ServiceApp',
    };
    if (sourceLabels[source]) {
      document.getElementById('source-pill').innerHTML = `<span class="status-dot"></span>${sourceLabels[source]} · Darmowa aplikacja`;
    }

    // Detect visitor OS to highlight the right store button
    const ua = navigator.userAgent || '';
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);

    const storeLinks = [
      {
        id: 'android',
        title: '🤖 Pobierz na Androida',
        subtitle: 'Oficjalna aplikacja w Google Play',
        url: buildTrackedStoreUrl(params.get('android') || config.appLinks?.android || '', { source, campaign, ref: 'landing' }),
        recommended: isAndroid || !isIOS,
      },
      {
        id: 'ios',
        title: '🍎 Pobierz na iPhone (iOS)',
        subtitle: 'Oficjalna aplikacja w App Store',
        url: buildTrackedStoreUrl(params.get('ios') || config.appLinks?.ios || '', { source, campaign, ref: 'landing' }),
        recommended: isIOS,
      },
      {
        id: 'web',
        title: '🌐 Otwórz stronę ServiceApp',
        subtitle: config.appLinks?.web || 'https://serviceapp.mobi',
        url: buildTrackedStoreUrl(params.get('web') || config.appLinks?.web || 'https://serviceapp.mobi', { source, campaign, ref: 'landing' }),
        recommended: false,
      },
    ];

    const storeContainer = document.getElementById('store-buttons');
    storeContainer.innerHTML = '';
    for (const item of storeLinks) {
      if (!item.url) continue;
      const a = document.createElement('a');
      a.className = `store-btn${item.recommended ? ' recommended' : ''}`;
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';

      const left = document.createElement('div');
      left.style.textAlign = 'left';
      const titleDiv = document.createElement('div');
      titleDiv.textContent = item.title;
      const sub = document.createElement('small');
      sub.textContent = item.subtitle;
      left.appendChild(titleDiv);
      left.appendChild(sub);

      const arrow = document.createElement('span');
      arrow.textContent = 'Pobierz →';

      a.appendChild(left);
      a.appendChild(arrow);
      storeContainer.appendChild(a);
    }

    // Quick Click-to-WhatsApp links from active rules
    const actionsEl = document.getElementById('quick-actions');
    const activeRules = (config.rules || []).filter((r) => r.enabled !== false).slice(0, 4);
    actionsEl.innerHTML = '';
    for (const rule of activeRules) {
      const url = buildWhatsAppUrl({
        phone,
        text: rule.whatsappCtaText || config.whatsapp?.defaultMessage || `Cześć! Chcę pobrać ${brandName}.`,
        campaign,
        source,
        username: `użytkownik z ${source}`,
        keyword: rule.keywords?.[0] || 'app',
        brand: brandName,
        appName: brandName,
      });

      const a = document.createElement('a');
      a.className = 'action-btn';
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';

      const titleSpan = document.createElement('span');
      titleSpan.textContent = rule.name;
      const arrowSpan = document.createElement('span');
      arrowSpan.className = 'arrow';
      arrowSpan.textContent = 'WhatsApp →';

      a.appendChild(titleSpan);
      a.appendChild(arrowSpan);
      actionsEl.appendChild(a);
    }

    const defaultWaUrl = buildWhatsAppUrl({
      phone,
      text: config.whatsapp?.defaultMessage || `Cześć! Piszę z ${source}. Chcę pobrać aplikację ${brandName}!`,
      campaign,
      source,
      brand: brandName,
      appName: brandName,
    });

    if (defaultWaUrl) {
      document.getElementById('landing-qr').innerHTML = generateQrSvg(defaultWaUrl, { pixelSize: 150, margin: 2 });
    }

    document.getElementById('custom-wa-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('visitor-name').value.trim();
      const msg = document.getElementById('visitor-msg').value.trim();
      const finalMsg = [
        name ? `Cześć, tu ${name}!` : 'Cześć!',
        msg || `Chcę pobrać aplikację ${brandName}.`,
        `(źródło: ${source}, kampania: ${campaign})`,
      ].join(' ');

      const url = buildWhatsAppUrl({ phone, text: finalMsg, campaign, source, brand: brandName, appName: brandName });
      if (url) window.open(url, '_blank', 'noopener,noreferrer');
    });
  </script>
</body>
</html>
